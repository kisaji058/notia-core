<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
  <title>Notia Calendar</title>
<link rel="prefetch" href="/">
<link rel="prefetch" href="/today">
<link rel="prefetch" href="/tasks">
<link rel="prefetch" href="/calendar">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/calendar.css">
</head>

<body class="calendar-page">
  <header class="chat-header">
  <div class="chat-header-brand">
    <img
      class="chat-header-logo"
      src="/images/notia-logo.png"
      alt=""
    >

    <img
      class="chat-header-wordmark"
      src="/images/notia-wordmark.png"
      alt="Notia"
    >
  </div>

  <button
    class="account-button"
    type="button"
    aria-label="アカウントを開く"
    title="アカウント"
  >
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle
        cx="12"
        cy="8"
        r="3.5"
      ></circle>

      <path
        d="M5 20c.7-4 3.2-6 7-6s6.3 2 7 6"
      ></path>
    </svg>
  </button>
</header>
  <section class="calendar-controls">
  <div
    class="calendar-view-switch"
    aria-label="カレンダー表示切り替え"
  >
    <button
      class="calendar-view-button"
      type="button"
      data-calendar-view="month"
    >
      月
    </button>

    <button
      class="calendar-view-button"
      type="button"
      data-calendar-view="week"
    >
      週
    </button>

    <button
      class="calendar-view-button active"
      type="button"
      data-calendar-view="day"
      aria-pressed="true"
    >
      日
    </button>
  </div>

  <div class="calendar-date-nav">
    <button
      id="prevDayButton"
      class="calendar-date-nav-button"
      type="button"
      aria-label="前の日へ"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m15 5-7 7 7 7"></path>
      </svg>
    </button>

    <div class="calendar-date-area">
      <div class="calendar-date-picker-wrap">
        <h1 id="calendarTitle"></h1>

        <input
          id="datePicker"
          class="calendar-date-picker-input"
          type="date"
          aria-label="表示する日付を選択"
        >
      </div>
    </div>

    <button
      id="nextDayButton"
      class="calendar-date-nav-button"
      type="button"
      aria-label="次の日へ"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m9 5 7 7-7 7"></path>
      </svg>
    </button>

    <button
      id="todayButton"
      class="today-button"
      type="button"
    >
      今日
    </button>
  </div>
</section>

  <div class="calendar-scroll-area">

<main class="calendar-main">
  <!-- 月表示 -->
  <section
    id="monthView"
    class="calendar-view-panel month-view"
    aria-label="月表示"
    hidden
  >
    <div
      id="monthWeekdays"
      class="month-weekdays"
    ></div>

    <div
      id="monthGrid"
      class="month-grid"
    ></div>
  </section>

  <!-- 週表示 -->
  <section
    id="weekView"
    class="calendar-view-panel week-view"
    aria-label="週表示"
    hidden
  >
  <div
  id="weekSummary"
  class="week-summary"
  aria-label="1週間の予定"
></div>
    <div
      id="weekGrid"
      class="week-grid"
    ></div>
  </section>

  <!-- 日表示 -->
  <section
  id="dayView"
  class="calendar-view-panel day-view"
  aria-label="日表示"
>
  <section class="unscheduled">
    <h2>時間未設定</h2>

    <div id="unscheduledList"></div>
  </section>

  <section
    id="timeline"
    class="timeline"
  ></section>
</section>

<section
  class="calendar-add-actions"
  aria-label="カレンダー操作"
>
  <button
    id="addEventButton"
    class="calendar-add-button calendar-add-button--event"
    type="button"
  >
    ＋ 予定を追加
  </button>

  <div class="calendar-add-secondary-row">
    <a
  class="calendar-add-button calendar-add-button--routine"
  href="/routine-edit.html?new=1"
    >
      ＋ ルーティーンを追加
    </a>

    <button
      id="syncButton"
      class="calendar-sync-button"
      type="button"
    >
      ↻ 同期
    </button>
  </div>

  <p
    id="syncStatus"
    class="calendar-sync-status"
    aria-live="polite"
  ></p>
</section>

</main>

</div>

<div
  id="eventSheetOverlay"
  class="sheet-overlay"
  hidden
></div>

<div
  id="eventSheetModal"
  class="sheet-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="eventSheetTitle"
  hidden
>
  <div class="sheet-header">
    <h3 id="eventSheetTitle">
      予定を追加
    </h3>

    <button
      id="closeEventSheetButton"
      type="button"
      aria-label="予定編集を閉じる"
    >
      ✕
    </button>
  </div>

  <div
    id="eventSheetContent"
    class="sheet-content"
  ></div>
</div>

  <nav class="bottom-nav">
  <a
    href="/"
    aria-label="チャット"
  >
    <img
      src="/images/nav/chat-unselected.png"
      alt=""
      class="bottom-nav-icon"
    >
    <span>チャット</span>
  </a>

  <a
    href="/today"
    aria-label="Today"
  >
    <img
      src="/images/nav/today-unselected.png"
      alt=""
      class="bottom-nav-icon today-nav-icon"
    >
    <span>Today</span>
  </a>

  <a
    href="/tasks"
    aria-label="プラン"
  >
    <img
      src="/images/nav/task-unselected.png"
      alt=""
      class="bottom-nav-icon bottom-nav-icon-task"
    >
    <span>プラン</span>
  </a>

  <a
    href="/calendar"
    class="active"
    aria-current="page"
    aria-label="カレンダー"
  >
    <svg
      class="bottom-nav-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <rect
        x="4"
        y="5"
        width="16"
        height="15"
        rx="2"
      ></rect>

      <path
        d="M8 3v4M16 3v4M4 9h16"
      ></path>
    </svg>

    <span>カレンダー</span>
  </a>
</nav>

<script src="/js/notiaRuntime.js?v=ios-runtime-4"></script>
<script src="/js/authGuard.js?v=app-ready-1"></script>
<script src="/js/components/accountMenu.js"></script>
<script src="/js/calendar.js?v=beta-20260814-1"></script>
</body>
</html>
