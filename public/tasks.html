<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notia タスク一覧</title>
  <link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="chat-header">
  <div class="chat-header-brand">
    <img
      class="chat-header-logo"
      src="/images/notia-logo.png"
      alt=""
    >

    <img
      class="chat-header-wordmark"
      src="/images/notia-wordmark.png"
      alt="Notia"
    >
  </div>

  <button
    class="account-button"
    type="button"
    aria-label="アカウントを開く"
    title="アカウント"
  >
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle
        cx="12"
        cy="8"
        r="3.5"
      ></circle>

      <path
        d="M5 20c.7-4 3.2-6 7-6s6.3 2 7 6"
      ></path>
    </svg>
  </button>
</header>
  
<div
  id="sheetOverlay"
  class="sheet-overlay"
  hidden
></div>

<div
  id="sheetModal"
  class="sheet-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="sheetTitle"
  hidden
>
  <div class="sheet-header">
    <h3 id="sheetTitle"></h3>

    <button
      id="closeSheetButton"
      type="button"
      aria-label="シートを閉じる"
    >
      ✕
    </button>
  </div>

  <div
    id="sheetContent"
    class="sheet-content"
  ></div>
</div>

  <main class="app task-app">
    <header class="task-header">
  <div class="task-progress-row">
  <p class="task-progress-text">
    <strong id="taskProgressCount">0</strong>
    件のタスクが進行中
  </p>

  <button
    id="addTaskButton"
    class="task-add-button"
    type="button"
  >
    <span aria-hidden="true">＋</span>
    <span>タスクを追加</span>
  </button>
</div>

  <div class="task-header-actions">


  <button
    id="filterButton"
    type="button"
    aria-label="絞り込み"
  >
    <span>🔍</span>
    <span>絞り込み</span>
  </button>

  <button
  id="settingsButton"
  type="button"
  hidden
>
    <span>⚙</span>
    <span>設定</span>
  </button>
</div>
</header>


  <section class="task-section task-page">
  <div id="taskList">
    <p class="task-status">読み込み中...</p>
  </div>

  <div class="completed-link-area">
    <a
      class="completed-link-button"
      href="/tasks-completed"
    >
      過去50件の完了タスクを見る
      <span aria-hidden="true">›</span>
    </a>
  </div>
</section>

<nav class="bottom-nav">
  <a
    href="/"
    aria-label="チャット"
  >
    <img
      src="/images/nav/chat-unselected.png"
      alt=""
      class="bottom-nav-icon"
    >
    <span>チャット</span>
  </a>

  <a
    href="/today"
    aria-label="Today"
  >
    <img
      src="/images/nav/today-unselected.png"
      alt=""
      class="today-nav-icon"
    >
    <span>Today</span>
  </a>

  <a
    href="/tasks"
    class="active"
    aria-current="page"
    aria-label="タスク"
  >
    <img
      src="/images/nav/task-selected.png"
      alt=""
      class="bottom-nav-icon bottom-nav-icon-task"
    >
    <span>タスク</span>
  </a>

  <a
    href="/calendar"
    aria-label="カレンダー"
  >
    <svg
      class="bottom-nav-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <rect
        x="4"
        y="5"
        width="16"
        height="15"
        rx="2"
      ></rect>

      <path
        d="M8 3v4M16 3v4M4 9h16"
      ></path>
    </svg>

    <span>カレンダー</span>
  </a>
</nav>

<script src="/js/components/cardFactory.js"></script>
<script src="/js/taskUtils.js"></script>
<script src="/js/tasks.js"></script>
</body>
</html>
